# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Project Euler | 欧拉计划
subtitle: 
description: Project Euler | 欧拉计划 中文翻译站
author: sx349
language: zh-CN
timezone:

# URL
## If your site is put in a subdirectory, set url as 'http://yoursite.com/child' and root as '/child/'
url: http://yoursite.com
root: /
permalink: :title/
permalink_defaults:

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link: true # Open external links in new tab
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: true
  tab_replace:

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
## Set per_page to 0 to disable pagination
per_page: 0
pagination_dir: page

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: next

# Deployment
## Docs: https://hexo.io/docs/deployment.html
deploy:
  type: git
  repo: https://github.com/PE-CN/PE-CN.github.io
  branch: master

# Since
since: 2015

# Friend Sites
links_title: 友情链接
links:
 Project Euler: https://projecteuler.net
 饮水思源汉化: http://jakwings.is-programmer.com/Project_Euler
 译者博客: http://sx349.github.io
  
# Creative Commons
creative_commons: by-nc-sa

# Avatar
avatar: /images/avatar.png

# Swiftype Search
# swiftype_key: z6bmYNMJM3AR1esetWJa

search:
  path: search.xml
  field: post
  format: html
  limit: 10000
  
# Comments
disqus_shortname: pe-cn

